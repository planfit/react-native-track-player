name: validate
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should-build-docs: ${{ steps.filter.outputs.docs == 'true' || steps.filter.outputs.workflow == 'true' }}
      should-build-module: ${{ steps.filter.outputs.js == 'true' || steps.filter.outputs.workflow == 'true' }}
      should-check-types: ${{ steps.filter.outputs.js == 'true' || steps.filter.outputs.workflow == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflow:
              - '.github/workflows/validate.yml'
            js:
              - '.nvmrc'
              - 'eslint.config.mjs'
              - 'package.json'
              - 'tsconfig.json'
              - 'tsconfig.build.json'
              - 'yarn.lock'
              - 'src/**'
              - 'web/**'
              - 'lib/**'
              - 'example/src/**'
              - 'example/**.json'
              - 'example/**.js'
            docs:
              - 'docs/**'

  check-typescript:
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should-check-types == 'true'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack (Yarn 3)
        run: corepack enable
      - name: Install Dependencies
        run: yarn install --immutable
      - name: Check Lint, Format & Types
        run: |
          yarn lint
          yarn format
          yarn typecheck
      - name: Example - Check Lint, Format & Types
        run: |
          yarn example lint
          yarn example format
          yarn example typecheck

  build-module:
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should-build-module == 'true'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack (Yarn 3)
        run: corepack enable
      - name: Install Dependencies
        run: yarn install --immutable
      - name: Build Library
        run: yarn build
      # planfit-client-rn 은 이 포크를 github: URL 로 받아 커밋된 lib/ 를 그대로 쓴다
      # (prepare 스크립트 없음, 3fd0728). src 를 바꾸고 lib 를 다시 만들지 않으면 앱에 반영되지 않는다.
      - name: Check prebuilt lib is up to date
        run: git diff --exit-code -- lib

  build-docs:
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should-build-docs == 'true'
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack (Yarn 3)
        run: corepack enable
      - name: Install Dependencies
        run: yarn install --immutable
      - name: Build Docs
        run: yarn build
